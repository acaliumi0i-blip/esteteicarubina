<style>
:root{--gold:#e9b937;--darkgold:#98600d;--ink:#302313;--cream:#fff4d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Montserrat,Arial,sans-serif;background:radial-gradient(ellipse at 50% 20%,#fffdf2 0%,#fff3d2 65%,#f4e0ae 100%);overflow-x:hidden}
.background{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.background:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(ellipse at 30% 70%,transparent 0 90px,rgba(195,142,37,.035) 92px 94px,transparent 97px 150px)}
.bird{position:absolute;width:210px;height:125px;fill:#bb8a2c;opacity:.22;filter:blur(.2px)}
.bird.a{top:0;left:-65px;transform:rotate(-12deg)}
.bird.b{top:2%;right:-65px;transform:scaleX(-1) rotate(-14deg)}
.bird.c{top:35%;right:-115px;transform:rotate(22deg);opacity:.11}
.bird.d{bottom:-10px;right:-45px;transform:rotate(-12deg)}
.leaf{position:absolute;width:180px;height:240px;opacity:.14;stroke:#ae842c;fill:none;stroke-width:2}
.leaf.a{top:43%;left:-100px;transform:rotate(-24deg)}
.leaf.b{bottom:5%;right:-115px;transform:rotate(28deg)}
main{width:min(100% - 32px,520px);margin:auto;position:relative;z-index:1;padding:38px 0 28px}
header{text-align:center;padding:30px 0 37px}
.kicker{font-size:clamp(16px,4vw,21px);letter-spacing:.46em;font-weight:500;margin:0 0 -10px 0;padding-left:.46em}
h1{font:400 clamp(94px,25vw,146px)/.95 Allura,"Brush Script MT",cursive;color:#98600d;margin:0 0 2px;text-shadow:0 2px 2px #fff8df}
.since{display:flex;align-items:center;justify-content:center;gap:22px;font-size:15px;letter-spacing:.35em;margin:5px 0 15px;padding-left:.35em}
.since:before,.since:after{content:"";height:1px;width:65px;background:#c49340}
.city{font-size:14px;letter-spacing:.34em;margin:0;padding-left:.34em}
.actions{display:grid;gap:13px;margin:0 auto}
.action{min-height:79px;border-radius:29px;display:flex;align-items:center;gap:18px;padding:12px 22px;text-decoration:none;color:#3c2b15;background:linear-gradient(115deg,#fff8e7,#f8e9c6);border:1.5px solid #fff;box-shadow:0 9px 17px rgba(143,99,22,.15);transition:transform .2s,box-shadow .2s}
.action:nth-child(odd){background:linear-gradient(110deg,#f0c64f,#e7b434);color:white;border-color:#e5b333}
.action:hover{transform:translateY(-3px);box-shadow:0 13px 24px rgba(143,99,22,.23)}
.circle{display:grid;place-items:center;width:54px;height:54px;flex:none;border-radius:50%;background:rgba(255,255,255,.92);color:#81500e}
.circle svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.copy{display:grid;gap:6px;min-width:0}
.label{font-size:16px;font-weight:600;letter-spacing:.20em}
.detail{font-size:14px;font-weight:400;letter-spacing:.11em;overflow-wrap:anywhere}
.chevron{margin-left:auto;font-size:32px;font-weight:400;opacity:.9}
.location{display:grid;grid-template-columns:1fr;gap:18px;margin-top:25px;padding:25px;border-radius:29px;background:rgba(255,255,255,.72);box-shadow:0 12px 30px rgba(142,105,38,.13);border:1px solid rgba(255,255,255,.95)}
.loc-row{display:flex;align-items:center;gap:15px}
.pin{width:32px;height:32px;fill:none;stroke:#bc8727;stroke-width:1.8;flex:none}
.loc-overline{font-size:13px;letter-spacing:.04em}
.loc-city{margin:9px 0 0;font-size:17px;letter-spacing:.19em;font-weight:500}
.map{display:flex;align-items:center;gap:15px;padding:17px 20px;min-height:73px;border-radius:23px;background:linear-gradient(110deg,#f8eacb,#f5e5bf);text-decoration:none;color:var(--ink);font-size:14px;line-height:1.6;letter-spacing:.16em;font-weight:600}
.map svg{width:32px;height:32px;flex:none;stroke:#aa7d2b;stroke-width:1.7;fill:none}
.map .chevron{color:#a67824}
footer{text-align:center;padding:36px 0 10px}
.rule{display:flex;align-items:center;justify-content:center;gap:20px;color:#a77c2b;font-size:28px}
.rule:before,.rule:after{content:"";height:1px;background:#b88933;width:30%}
footer p{margin:15px 0 0;letter-spacing:.23em;font-size:10px;line-height:1.9}
@media(max-width:390px){main{width:calc(100% - 24px);padding-top:12px}.action{padding:11px 15px;gap:12px;min-height:72px}.circle{width:47px;height:47px}.label{font-size:13px}.detail{font-size:12px}.city{font-size:11px}.loc-city{font-size:14px}.location{padding:20px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
